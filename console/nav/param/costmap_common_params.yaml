# Robot Footprint (Exact Transbot chassis: 29cm x 24cm)
footprint: [[-0.145, -0.12], [-0.145, 0.12], [0.145, 0.12], [0.145, -0.12]]
map_type: costmap

obstacle_layer:
  enabled:              true
  max_obstacle_height:  0.6
  min_obstacle_height:  0.0
  combination_method:   1
  track_unknown_space:  true
  obstacle_range:       2.5
  raytrace_range:       3.0
  publish_voxel_map:    false
  observation_sources:  scan
  scan:
    data_type: LaserScan
    topic: "/scan"
    marking: true
    clearing: true
    inf_is_valid: true
    expected_update_rate: 0

inflation_layer:
  enabled:              true
  cost_scaling_factor:  3.0
  inflation_radius:     0.45

static_layer:
  enabled:              true
  map_topic:            "/map"